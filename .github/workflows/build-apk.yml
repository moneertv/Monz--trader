name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'          # daily research updates don't need a new APK
      - 'docs/**'
      - 'scripts/universe/**'
      - '.github/workflows/universe.yml'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Test app logic
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test tests/core.test.js tests/signals.test.js tests/research.test.js tests/backtest.test.js tests/alerts.test.js tests/universe.test.js

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest ships with the Android SDK preinstalled (ANDROID_HOME).
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log || {
            { grep -nE "error:|e: |Could not|failed" build.log | head -15; grep -A 12 "What went wrong" build.log; } | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MonzTrader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MonzTrader-apk
          path: MonzTrader.apk

      - name: Publish release (download link for your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Monz Trader build ${{ github.run_number }}
          make_latest: true
          files: MonzTrader.apk
          body: |
            Install: download **MonzTrader.apk** on your Android phone and open it.
            Allow "Install unknown apps" for your browser when Android asks.
