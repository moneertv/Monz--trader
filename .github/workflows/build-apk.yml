name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test app logic
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/core.test.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MonzTrader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MonzTrader-apk
          path: MonzTrader.apk

      - name: Publish release (download link for your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Monz Trader build ${{ github.run_number }}
          make_latest: true
          files: MonzTrader.apk
          body: |
            Install: download **MonzTrader.apk** on your Android phone and open it.
            Allow "Install unknown apps" for your browser when Android asks.
