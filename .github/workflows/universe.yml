name: Daily market universe

# Fetches the top 100 coins and the S&P 100 + ETFs with a year of daily closes and saves them to
# data/universe/ for the app. Runs after the US close; can also be started by hand.
on:
  schedule:
    - cron: '17 22 * * *'      # 22:17 UTC = 01:17 Amman, after the US close
  push:                         # also rebuild when the builder itself changes
    branches: [main]
    paths: ['scripts/universe/**', '.github/workflows/universe.yml']
  workflow_dispatch:
    inputs:
      what:
        description: 'crypto, us or all'
        default: 'all'

permissions:
  contents: write

concurrency:
  group: universe
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test parsers
        run: node --test tests/universe.test.js
      - name: Build universe
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: node scripts/universe/build.mjs "${{ github.event.inputs.what || 'all' }}"
        continue-on-error: true
      - name: Summary
        run: |
          for f in data/universe/*.json; do
            node -e "const d=require('./$f');console.log('::notice title=$f::'+d.assets.length+' assets, '+(d.skipped||[]).length+' skipped, generated '+d.generated_at+' — '+d.source)" || true
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/universe/*.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Universe update $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
