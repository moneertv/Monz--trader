name: Daily market universe

# Fetches the top 100 coins and the S&P 100 + ETFs with a year of daily closes and saves them to
# data/universe/ for the app. Runs after the US close; can also be started by hand.
on:
  schedule:
    - cron: '17 22 * * *'      # 22:17 UTC = 01:17 Amman, after the US close
  push:                         # also rebuild when the builder itself changes
    branches: [main]
    paths: ['scripts/universe/**', '.github/workflows/universe.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        kind: [crypto, us]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: universe-${{ matrix.kind }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test parsers
        run: node --test tests/universe.test.js
      - name: Build ${{ matrix.kind }}
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: node scripts/universe/build.mjs ${{ matrix.kind }}
        continue-on-error: true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/universe/${{ matrix.kind }}.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "::notice::no new ${{ matrix.kind }} data"; exit 0; fi
          git commit -m "Universe update (${{ matrix.kind }}) $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
