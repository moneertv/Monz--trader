plugins {
    id 'com.android.application'
}

def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.monz.trader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.monz.trader'
        minSdk 24
        targetSdk 35
        versionCode buildNumber
        versionName "0.1.${buildNumber}"
    }

    // One fixed key for every build, so each new APK installs as an update over the old one
    // (keeping your data). Android refuses updates signed with a different key.
    // Personal-use key: it is in this repo, so anyone with repo access could sign an APK that
    // updates this app. Only install APKs from your own Releases page.
    signingConfigs {
        monz {
            storeFile file('monz-trader.keystore')
            storePassword 'monztrader'
            keyAlias 'monz'
            keyPassword 'monztrader'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.monz
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
