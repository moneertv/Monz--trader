<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monz Trader</title>
<style>
  :root {
    --bg: #0b1220; --panel: #121b2e; --panel2: #18233a; --line: #24324d;
    --text: #e7ecf5; --muted: #8d9ab3; --gold: #d4a93c; --up: #3cc48a; --down: #ef5b5b; --warn: #e3a23b; --accent: #5b8def;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: 72px; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(11,18,32,.96); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 17px; margin: 0; flex: 1; letter-spacing: .2px; }
  header h1 span { color: var(--gold); }
  main { padding: 12px 16px; max-width: 760px; margin: 0 auto; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--panel); border-top: 1px solid var(--line); z-index: 5; }
  nav button { flex: 1; background: none; border: 0; color: var(--muted); padding: 9px 0 11px; font-size: 10.5px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  nav button.on { color: var(--gold); }
  nav svg { width: 22px; height: 22px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .big { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kv { background: var(--panel2); border-radius: 10px; padding: 10px; }
  .kv .k { color: var(--muted); font-size: 12px; } .kv .v { font-weight: 600; font-variant-numeric: tabular-nums; }
  .pct-up { color: var(--up); font-weight: 600; } .pct-down { color: var(--down); font-weight: 600; }
  .up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--muted); } .warn { color: var(--warn); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  td { padding: 8px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.n, th.n { text-align: right; }
  tr:last-child td { border-bottom: 0; }
  .row { display: flex; align-items: center; gap: 10px; }
  .grow { flex: 1; min-width: 0; }
  .sub { font-size: 12px; color: var(--muted); }
  .tag { display: inline-block; font-size: 10.5px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .tag.stale { color: var(--warn); border-color: var(--warn); } .tag.live { color: var(--up); border-color: var(--up); }
  button.btn, .btn { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 10px 14px; font-weight: 600; font-size: 14px; }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  .btn.gold { background: var(--gold); color: #1a1405; }
  .btn.small { padding: 6px 10px; font-size: 13px; }
  .btn.danger { background: transparent; color: var(--down); border: 1px solid var(--down); }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input, select, textarea { width: 100%; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 9px; padding: 10px; font: inherit; }
  textarea { min-height: 120px; font-family: ui-monospace, monospace; font-size: 12px; }
  .bar { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--panel2); margin: 8px 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .err { background: rgba(239,91,91,.1); border: 1px solid rgba(239,91,91,.4); color: #ffb4b4; border-radius: 10px; padding: 10px; font-size: 13px; margin-bottom: 10px; word-break: break-word; }
  .note { background: rgba(227,162,59,.08); border: 1px solid rgba(227,162,59,.35); border-radius: 10px; padding: 10px; font-size: 13px; margin-bottom: 10px; }
  .spin { animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
  .seg { display: flex; background: var(--panel2); border-radius: 10px; padding: 3px; gap: 3px; margin-bottom: 10px; overflow-x: auto; }
  .seg button { flex: 1; background: none; border: 0; color: var(--muted); padding: 7px 8px; border-radius: 8px; font-size: 13px; white-space: nowrap; }
  .seg button.on { background: var(--panel); color: var(--text); }
  .list-item { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .list-item:last-child { border-bottom: 0; }
  svg.chart { width: 100%; height: 160px; display: block; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; letter-spacing: .3px; white-space: nowrap; }
  .pill.buy { background: rgba(60,196,138,.15); color: var(--up); } .pill.sell { background: rgba(239,91,91,.15); color: var(--down); } .pill.hold { background: rgba(141,154,179,.15); color: var(--muted); }
  .fbar { position: relative; height: 8px; background: var(--panel2); border-radius: 99px; margin-top: 4px; }
  .fbar i { position: absolute; top: 0; bottom: 0; border-radius: 99px; }
  .fbar::after { content: ''; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--line); }
  .toast { position: fixed; left: 16px; right: 16px; bottom: 84px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; z-index: 20; }
  .empty { text-align: center; color: var(--muted); padding: 24px 8px; }
</style>
</head>
<body>
<header>
  <h1>Monz <span>Trader</span></h1>
  <button class="btn ghost small" id="refreshBtn" aria-label="Refresh prices">↻ Refresh</button>
  <button class="btn ghost small" data-nav="settings" aria-label="Settings">⚙</button>
</header>
<main id="view"></main>
<nav id="nav"></nav>
<script src="core.js"></script>
<script src="sources.js"></script>
<script src="signals.js"></script>
<script src="backtest.js"></script>
<script src="app.js"></script>
</body>
</html>
